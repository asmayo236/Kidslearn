<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Robot Programador – Bruno Aprende 🤖</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#845EC2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bruno Aprende">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --c1: #1a1a2e; --c2: #533483; }

    /* ===== LAYOUT ===== */
    .game-wrap {
      display: flex;
      gap: 20px;
      padding: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 840px;
      margin: 0 auto;
    }

    .grid-section {
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    .controls-section {
      flex: 0 0 auto;
      width: 210px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ===== LEVEL INFO ===== */
    .level-info {
      background: white;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      margin-bottom: 14px;
      text-align: center;
    }
    .level-name  { font-size: 1.15em; font-weight: 900; color: #533483; }
    .level-hint  { font-size: 0.88em; color: #555; margin-top: 5px; }
    .level-steps { font-size: 0.85em; color: #FF9A3C; font-weight: 700; margin-top: 4px; }

    /* Step dots */
    .steps-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .step-dot  { width: 11px; height: 11px; border-radius: 50%; background: #e0e0e0; transition: background 0.2s; }
    .step-dot.used { background: #4D96FF; }

    /* Level progress bar */
    .level-progress {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .lv-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65em;
      font-weight: 900;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
      border: 2px solid transparent;
    }
    .lv-dot.done    { background: #6BCB77; color: white; }
    .lv-dot.current { background: #533483; color: white; border-color: #FFD93D; }
    .lv-dot:hover   { transform: scale(1.15); }

    /* ===== GRID ===== */
    .robot-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      background: #1a1a2e;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      width: 100%;
      aspect-ratio: 1;
    }

    .cell {
      background: #16213e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1em, 4vw, 1.9em);
      aspect-ratio: 1;
      transition: background 0.25s;
      position: relative;
    }

    .cell.robot    { background: #0f3460; }
    .cell.goal     { background: #1a472a; animation: goalPulse 1.5s infinite; }
    .cell.obstacle { background: #3d0000; }
    .cell.visited  { background: #1a3a5c; }
    .cell.crash    { background: #5c0000 !important; animation: shake 0.45s; }
    .cell.success  { background: #1a5c2a !important; animation: popIn 0.4s; }

    @keyframes goalPulse {
      0%,100% { background: #1a472a; }
      50%      { background: #2d6a4f; }
    }

    /* Result banner */
    .result-banner {
      text-align: center;
      font-size: 1.15em;
      font-weight: 900;
      padding: 12px;
      border-radius: 14px;
      margin-top: 12px;
      display: none;
      animation: popIn 0.3s;
    }
    .result-banner.success { display: block; background: #e8f8e8; color: #2e7d32; }
    .result-banner.fail    { display: block; background: #ffe8e8; color: #c62828; }

    /* ===== D-PAD ===== */
    .dpad-label {
      text-align: center;
      font-size: 0.9em;
      font-weight: 800;
      color: #555;
      margin-bottom: 8px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 6px;
      margin: 0 auto;
      width: fit-content;
    }

    .dpad-btn {
      width: 60px; height: 60px;
      border: none;
      border-radius: 16px;
      font-size: 1.7em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { transform: scale(0.88); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

    .dpad-dir { background: linear-gradient(145deg, #4D96FF, #845EC2); color: white; }
    .dpad-ok  {
      background: linear-gradient(145deg, #6BCB77, #00C9A7);
      color: white;
      font-size: 1.3em;
      font-weight: 900;
    }
    .dpad-empty { background: transparent; pointer-events: none; box-shadow: none; }

    /* ===== COMMAND SEQUENCE ===== */
    .cmd-label { font-size: 0.88em; font-weight: 800; color: #555; margin-bottom: 6px; }
    .cmd-sequence {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 48px;
      background: #f5f5f5;
      border-radius: 14px;
      padding: 7px;
      border: 2px solid #e0e0e0;
      transition: border-color 0.3s;
    }
    .cmd-badge {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      animation: popIn 0.18s;
      transition: all 0.2s;
    }
    .cmd-badge.pending  { background: linear-gradient(135deg,#4D96FF,#845EC2); box-shadow: 0 2px 6px rgba(77,150,255,0.35); }
    .cmd-badge.current  { background: linear-gradient(135deg,#FFD93D,#FF9A3C); box-shadow: 0 0 12px rgba(255,217,61,0.7); transform: scale(1.15); }
    .cmd-badge.done     { background: linear-gradient(135deg,#6BCB77,#00C9A7); }
    .cmd-badge.fail     { background: linear-gradient(135deg,#FF6B6B,#FF9A3C); }

    /* ===== ACTION BUTTONS ===== */
    .action-row { display: flex; gap: 8px; }

    .btn-run {
      flex: 1;
      background: linear-gradient(135deg, #6BCB77, #00C9A7);
      color: white; border: none;
      border-radius: 14px; padding: 13px 8px;
      font-size: 1em; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 14px rgba(107,203,119,0.4);
      transition: transform 0.15s;
    }
    .btn-run:hover:not(:disabled) { transform: scale(1.04); }
    .btn-run:disabled { opacity: 0.45; cursor: default; }

    .btn-clear {
      background: linear-gradient(135deg, #FF6B6B, #FF9A3C);
      color: white; border: none;
      border-radius: 14px; padding: 13px 14px;
      font-size: 1.1em; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 12px rgba(255,107,107,0.35);
      transition: transform 0.15s;
    }
    .btn-clear:hover { transform: scale(1.06); }

    /* ===== LEVEL COMPLETE MODAL ===== */
    .lc-box {
      background: white;
      border-radius: 28px;
      padding: 38px 28px;
      text-align: center;
      max-width: 330px;
      width: 92%;
      animation: popIn 0.4s;
    }
    .lc-box .lc-icon { font-size: 5em; display: block; }
    .lc-box h2 { font-size: 1.7em; font-weight: 900; color: #533483; margin: 12px 0 6px; }
    .lc-box p  { color: #555; margin-bottom: 22px; font-size: 1.05em; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 540px) {
      .game-wrap { flex-direction: column; align-items: center; padding: 12px; }
      .grid-section { max-width: 320px; width: 100%; }
      .controls-section { width: 100%; max-width: 320px; }
      .dpad { grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); }
      .dpad-btn { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="btn-home">🏠 Inicio</a>
    <span class="logo">🤖 Robot Programador</span>
  </nav>

  <!-- Header -->
  <div class="page-header" style="--c1:#1a1a2e;--c2:#533483;">
    <span class="page-icon">🤖</span>
    <h1>Robot Programador</h1>
    <p>¡Programa al robot para que llegue a la estrella! ⭐</p>
  </div>

  <div class="game-wrap">

    <!-- ===== LEFT: GRID ===== -->
    <div class="grid-section">

      <!-- Level info -->
      <div class="level-info">
        <div class="level-name"  id="level-name">Nivel 1</div>
        <div class="level-hint"  id="level-hint">💡 ...</div>
        <div class="level-steps" id="level-steps">Pasos disponibles: 0</div>
        <div class="steps-row"   id="steps-row"></div>
        <!-- Level dots -->
        <div class="level-progress" id="level-progress"></div>
      </div>

      <!-- 6x6 Grid -->
      <div class="robot-grid" id="robot-grid"></div>

      <!-- Result banner -->
      <div class="result-banner" id="result-banner"></div>
    </div>

    <!-- ===== RIGHT: CONTROLS ===== -->
    <div class="controls-section">

      <!-- D-pad -->
      <div>
        <div class="dpad-label">🕹️ Añade instrucciones:</div>
        <div class="dpad">
          <div class="dpad-empty"></div>
          <button class="dpad-btn dpad-dir" onclick="addCmd('U')" title="Arriba">⬆️</button>
          <div class="dpad-empty"></div>

          <button class="dpad-btn dpad-dir" onclick="addCmd('L')" title="Izquierda">⬅️</button>
          <button class="dpad-btn dpad-ok"  onclick="runProgram()" title="Ejecutar">▶</button>
          <button class="dpad-btn dpad-dir" onclick="addCmd('R')" title="Derecha">➡️</button>

          <div class="dpad-empty"></div>
          <button class="dpad-btn dpad-dir" onclick="addCmd('D')" title="Abajo">⬇️</button>
          <div class="dpad-empty"></div>
        </div>
      </div>

      <!-- Command sequence -->
      <div>
        <div class="cmd-label">📋 Tu programa:</div>
        <div class="cmd-sequence" id="cmd-sequence">
          <span style="color:#bbb;font-size:0.85em;padding:8px 4px;">Pulsa las flechas...</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-row">
        <button class="btn-run" id="btn-run" onclick="runProgram()">▶ Ejecutar</button>
        <button class="btn-clear" onclick="clearLevel()" title="Limpiar">🗑️</button>
      </div>

    </div>
  </div>

  <!-- Level complete modal -->
  <div class="modal-overlay" id="celebration-modal">
    <div class="lc-box">
      <span class="lc-icon cel-emoji">🌟</span>
      <h2 class="cel-msg">¡Nivel completado!</h2>
      <p class="cel-sub">¡Programaste al robot perfectamente!</p>
      <button class="btn btn-primary" id="next-btn" onclick="nextLevel()">Siguiente nivel ➡️</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script>

    // ===== LEVELS =====
    // r = row (0=top), c = col (0=left)
    const LEVELS = [
      // ── Easy: single direction ──
      { name:'Nivel 1',  stars:1, robot:{r:2,c:0}, goal:{r:2,c:4}, maxSteps:5,
        hint:'¡Ve hacia la derecha! ➡️' },
      { name:'Nivel 2',  stars:1, robot:{r:0,c:3}, goal:{r:4,c:3}, maxSteps:5,
        hint:'¡Baja todo recto! ⬇️' },
      { name:'Nivel 3',  stars:1, robot:{r:3,c:5}, goal:{r:3,c:1}, maxSteps:5,
        hint:'¡Ve hacia la izquierda! ⬅️' },
      { name:'Nivel 4',  stars:1, robot:{r:5,c:3}, goal:{r:1,c:3}, maxSteps:5,
        hint:'¡Sube todo recto! ⬆️' },
      // ── Medium: two directions ──
      { name:'Nivel 5',  stars:2, robot:{r:5,c:0}, goal:{r:2,c:3}, maxSteps:7,
        hint:'Sube y ve a la derecha 🤔' },
      { name:'Nivel 6',  stars:2, robot:{r:0,c:5}, goal:{r:4,c:1}, maxSteps:9,
        hint:'Baja y ve a la izquierda 🤔' },
      { name:'Nivel 7',  stars:2, robot:{r:5,c:5}, goal:{r:1,c:1}, maxSteps:9,
        hint:'Sube y ve a la izquierda 🤔' },
      { name:'Nivel 8',  stars:2, robot:{r:0,c:0}, goal:{r:5,c:4}, maxSteps:10,
        hint:'¡Piensa bien el camino! 🧠' },
      // ── Hard: with obstacles ──
      { name:'Nivel 9',  stars:3, robot:{r:0,c:0}, goal:{r:5,c:5}, maxSteps:12,
        obstacles:[{r:1,c:1},{r:2,c:2},{r:3,c:3},{r:4,c:4}],
        hint:'¡Rodea los obstáculos por la derecha! 🧱' },
      { name:'Nivel 10', stars:3, robot:{r:5,c:0}, goal:{r:0,c:5}, maxSteps:12,
        obstacles:[{r:2,c:1},{r:2,c:2},{r:3,c:3},{r:3,c:4}],
        hint:'¡Busca el camino libre! 🧠' },
    ];

    const ARROWS = { U:'⬆️', D:'⬇️', L:'⬅️', R:'➡️' };
    const DELTAS = { U:{r:-1,c:0}, D:{r:1,c:0}, L:{r:0,c:-1}, R:{r:0,c:1} };

    let currentLv   = 0;
    let commands    = [];
    let isRunning   = false;
    let completed   = new Set();   // completed level indices

    // ── helpers ──
    function hasObstacle(r, c) {
      return (LEVELS[currentLv].obstacles || []).some(o => o.r===r && o.c===c);
    }
    function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

    // ===== RENDER GRID =====
    function renderGrid(path=[], robotAt=null, crashAt=null) {
      const lv   = LEVELS[currentLv];
      const rPos = robotAt || lv.robot;
      const grid = document.getElementById('robot-grid');
      grid.innerHTML = '';

      for (let r=0; r<6; r++) {
        for (let c=0; c<6; c++) {
          const cell   = document.createElement('div');
          cell.className = 'cell';

          const isRobot = rPos.r===r && rPos.c===c;
          const isGoal  = lv.goal.r===r && lv.goal.c===c;
          const isObs   = hasObstacle(r, c);
          const isCrash = crashAt && crashAt.r===r && crashAt.c===c;
          const isPath  = path.some(p => p.r===r && p.c===c);

          if (isCrash)             { cell.classList.add('crash');    cell.textContent='💥'; }
          else if (isRobot&&isGoal){ cell.classList.add('success');  cell.textContent='🎉'; }
          else if (isRobot)        { cell.classList.add('robot');    cell.textContent='🤖'; }
          else if (isGoal)         { cell.classList.add('goal');     cell.textContent='⭐'; }
          else if (isObs)          { cell.classList.add('obstacle'); cell.textContent='🧱'; }
          else if (isPath)         { cell.classList.add('visited');  cell.textContent='·';  }

          grid.appendChild(cell);
        }
      }
    }

    // ===== LOAD LEVEL =====
    function loadLevel(idx) {
      currentLv = idx;
      commands  = [];
      isRunning = false;
      const lv  = LEVELS[idx];

      document.getElementById('level-name').textContent  = lv.name + ' ' + '⭐'.repeat(lv.stars);
      document.getElementById('level-hint').textContent  = '💡 ' + lv.hint;
      document.getElementById('level-steps').textContent = `Pasos disponibles: ${lv.maxSteps}`;
      document.getElementById('btn-run').disabled = false;

      // Steps dots
      const sRow = document.getElementById('steps-row');
      sRow.innerHTML = '';
      for (let i=0; i<lv.maxSteps; i++) {
        const d = document.createElement('div');
        d.className = 'step-dot';
        sRow.appendChild(d);
      }

      // Level progress dots
      buildProgressDots();
      renderGrid();
      updateCmdDisplay();
      hideBanner();
      hideCelebration();
    }

    function buildProgressDots() {
      const wrap = document.getElementById('level-progress');
      wrap.innerHTML = '';
      LEVELS.forEach((lv, i) => {
        const d = document.createElement('div');
        d.className = 'lv-dot';
        d.textContent = i+1;
        if (completed.has(i)) d.classList.add('done');
        if (i === currentLv)  d.classList.add('current');
        d.onclick = () => { if (!isRunning) loadLevel(i); };
        wrap.appendChild(d);
      });
    }

    // ===== COMMANDS =====
    function addCmd(dir) {
      if (isRunning) return;
      const lv = LEVELS[currentLv];
      if (commands.length >= lv.maxSteps) {
        // Wiggle the sequence box
        const seq = document.getElementById('cmd-sequence');
        seq.style.borderColor = '#FF6B6B';
        setTimeout(() => seq.style.borderColor = '#e0e0e0', 600);
        playWrong();
        return;
      }
      playClick();
      commands.push(dir);
      updateCmdDisplay();
    }

    function updateCmdDisplay() {
      const seq = document.getElementById('cmd-sequence');
      seq.innerHTML = '';
      if (commands.length === 0) {
        seq.innerHTML = '<span style="color:#bbb;font-size:0.85em;padding:8px 4px;">Pulsa las flechas...</span>';
      } else {
        commands.forEach((cmd, i) => {
          const b = document.createElement('div');
          b.className = 'cmd-badge pending';
          b.id = `badge-${i}`;
          b.textContent = ARROWS[cmd];
          seq.appendChild(b);
        });
      }
      // Update step dots
      document.querySelectorAll('#steps-row .step-dot').forEach((d, i) => {
        d.classList.toggle('used', i < commands.length);
      });
    }

    function clearLevel() {
      if (isRunning) return;
      commands  = [];
      isRunning = false;
      document.getElementById('btn-run').disabled = false;
      playClick();
      renderGrid();
      updateCmdDisplay();
      hideBanner();
    }

    // ===== RUN =====
    async function runProgram() {
      if (isRunning) return;
      if (commands.length === 0) {
        speak('¡Añade instrucciones primero!', 0.85, 1.1);
        const seq = document.getElementById('cmd-sequence');
        seq.style.borderColor = '#FF9A3C';
        setTimeout(() => seq.style.borderColor = '#e0e0e0', 700);
        return;
      }

      isRunning = true;
      document.getElementById('btn-run').disabled = true;
      hideBanner();

      const lv  = LEVELS[currentLv];
      let pos   = { ...lv.robot };
      const path = [];

      for (let i=0; i<commands.length; i++) {
        // Highlight current badge
        document.querySelectorAll('.cmd-badge').forEach((b, j) => {
          b.className = 'cmd-badge ' +
            (j < i ? 'done' : j === i ? 'current' : 'pending');
        });

        await delay(420);

        const delta = DELTAS[commands[i]];
        const nr = pos.r + delta.r;
        const nc = pos.c + delta.c;

        // Out of bounds
        if (nr < 0 || nr > 5 || nc < 0 || nc > 5) {
          renderGrid(path, pos, pos);
          await delay(200);
          document.querySelectorAll('.cmd-badge').forEach((b,j)=>{
            if(j===i) b.className='cmd-badge fail';
          });
          showBanner(false, '¡Ups! El robot salió de la cuadrícula 😅');
          speak('¡Ups! El robot se cayó del borde. ¡Inténtalo de nuevo!', 0.85, 1.1);
          isRunning = false;
          document.getElementById('btn-run').disabled = false;
          return;
        }

        // Hit obstacle
        if (hasObstacle(nr, nc)) {
          renderGrid(path, pos, {r:nr, c:nc});
          await delay(200);
          document.querySelectorAll('.cmd-badge').forEach((b,j)=>{
            if(j===i) b.className='cmd-badge fail';
          });
          showBanner(false, '¡Ups! El robot chocó con un obstáculo 🧱');
          speak('¡El robot chocó con un obstáculo! ¡Inténtalo de nuevo!', 0.85, 1.1);
          isRunning = false;
          document.getElementById('btn-run').disabled = false;
          return;
        }

        path.push({ ...pos });
        pos = { r:nr, c:nc };
        renderGrid(path, pos);

        // Goal reached!
        if (pos.r === lv.goal.r && pos.c === lv.goal.c) {
          document.querySelectorAll('.cmd-badge').forEach(b => b.className='cmd-badge done');
          await delay(300);
          renderGrid(path, pos);         // shows 🎉
          showBanner(true, '¡Llegaste a la estrella! 🌟');
          playCorrect();
          launchConfetti(2800);
          speak('¡Felicidades! ¡Llegaste a la estrella! ¡Eres un programador increíble!', 0.8, 1.15);
          completed.add(currentLv);
          buildProgressDots();

          await delay(1000);

          const isLast = currentLv >= LEVELS.length - 1;
          showCelebration(
            isLast ? '¡Has ganado todos los niveles! 🏆' : '¡Nivel completado! 🎉',
            '¡Eres un programador increíble, Bruno!',
            '🤖'
          );
          const nextBtn = document.getElementById('next-btn');
          if (isLast) {
            nextBtn.textContent = '🔄 Jugar de nuevo';
            nextBtn.onclick = () => { completed.clear(); loadLevel(0); hideCelebration(); };
          } else {
            nextBtn.textContent = 'Siguiente nivel ➡️';
            nextBtn.onclick = nextLevel;
          }
          isRunning = false;
          return;
        }
      }

      // Ran out of steps without reaching goal
      document.querySelectorAll('.cmd-badge').forEach(b => b.className='cmd-badge done');
      showBanner(false, '¡Casi! El robot no llegó a la estrella ⭐');
      speak('¡Casi! Necesitas más pasos o un camino diferente. ¡Inténtalo de nuevo!', 0.85, 1.1);
      isRunning = false;
      document.getElementById('btn-run').disabled = false;
    }

    function nextLevel() {
      hideCelebration();
      loadLevel(Math.min(currentLv + 1, LEVELS.length - 1));
    }

    function showBanner(ok, msg) {
      const b = document.getElementById('result-banner');
      b.className = 'result-banner ' + (ok ? 'success' : 'fail');
      b.textContent = msg;
    }
    function hideBanner() {
      document.getElementById('result-banner').className = 'result-banner';
    }

    // Keyboard shortcuts (for desktop/laptop)
    document.addEventListener('keydown', e => {
      if (isRunning) return;
      const map = { ArrowUp:'U', ArrowDown:'D', ArrowLeft:'L', ArrowRight:'R' };
      if (map[e.key]) { e.preventDefault(); addCmd(map[e.key]); }
      if (e.key === 'Enter') runProgram();
      if (e.key === 'Escape' || e.key === 'Backspace') clearLevel();
    });

    // ===== INIT =====
    loadLevel(0);
  </script>
</body>
</html>
